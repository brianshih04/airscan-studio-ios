name: AirScanStudio
options:
  bundleIdPrefix: com.brianshih
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: false
targets:
  AirScanStudio:
    type: application
    platform: iOS
    sources:
      - path: AirScanStudio
    info:
      path: AirScanStudio/Info.plist
      properties:
        CFBundleDisplayName: AirScan Studio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: AirScan Studio 需要存取區域網路以探索與連線您的掃描器與印表機。
        NSBonjourServices:
          - _uscan._tcp
          - _uscans._tcp
          - _ipp._tcp
          - _ipps._tcp
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
  AirScanStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AirScanStudioTests
    dependencies:
      - target: AirScanStudio
    info:
      path: AirScanStudioTests/Info.plist
      properties: {}
  AirScanStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirScanStudioUITests
    dependencies:
      - target: AirScanStudio
    info:
      path: AirScanStudioUITests/Info.plist
      properties: {}
